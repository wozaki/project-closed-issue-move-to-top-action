name: wait-for-workflows

on:
  pull_request:

jobs:
  wait-for-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: int128/wait-for-workflows-action@541cbf5228f152af771c126e176492e6026a1cc6 # v1.109.0
