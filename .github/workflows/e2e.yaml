name: e2e

on:
  pull_request:
    paths:
      - src/**
      - e2e/**
      - package.json
      - pnpm-lock.yaml
      - action.yaml
      - vitest.e2e.config.ts
      - .github/workflows/e2e.yaml
  push:
    branches:
      - main
    paths:
      - src/**
      - e2e/**
      - package.json
      - pnpm-lock.yaml
      - action.yaml
      - vitest.e2e.config.ts
      - .github/workflows/e2e.yaml
  schedule:
    # Weekly, to catch GitHub API changes that no pull request would trigger.
    - cron: '0 0 * * 1'
  workflow_dispatch:

# All runs share the fixture project, so they must not run at the same time.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    # Pull requests from forks cannot access the token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install -g pnpm@latest-10
      - run: pnpm i
      - run: pnpm run build
      - run: pnpm run e2e
        env:
          E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
